<!DOCTYPE html>
<html>
    <head>
        <title>8.3</title>
        <style>
            body{
                font-size:24px;
            }
            h1{
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>CSS Text Transform</h1>
        <ol>
            <li>This is default</li>
            <li style="text-transform:uppercase">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</li>
            <li style="text-transform:lowercase">Curabitur condimentum diam eget elit consequat, id pulvinar tellus posuere.</li>
            <li style="text-transform:capitalize">Cras condimentum ante vel purus semper mollis.</li>
            <li style="text-transform:full-width">Sed condimentum dolor at consectetur hendrerit.</li>        
        </ol>
    </body>
</html>
